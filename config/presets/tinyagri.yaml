# TinyAgri - the tuned configuration. This is what the current headline numbers
# were produced with; tinyagri-paper.yaml is the submission-time one.
extends: base

data_root: data/TinyAgri     # the six split directories are derived from this
models_dir: models/TinyAgri
output_dir: results/TinyAgri
seed: 98

input_shape: [60, 80, 3]
early_stopping: true
patience: 20
optimizer: adamw
lr_scheduler: plateau
lr_plateau_patience: 10
lr_plateau_factor: 0.2
min_lr: 1.0e-6
learning_rate: 1.0e-3
augment: true
epochs: 200

# Student - the model that ships to the MCU.
nanou:
  filters: [4, 8, 16]
  bottleneck: 16
  decoder_filters: [16, 8, 4]
  batch_size: 16
  weight_decay: 1.0e-4

  use_distillation: true
  teacher_model_name: bu_net
  teacher_weights: models/TinyAgri/bu_net.h5
  # CV stage-2 winner (photometric regime, CE on): best mIoU (0.8609) and F0.5
  # (0.9143) over the T x alpha grid. alpha sat at the low edge of the grid
  # (lower => more CE weight => more precision-favoring); T=0.7 was the mild
  # mIoU pick.
  alpha: 0.3
  temperature: 0.7

  # CV stage-3 winner: tversky_weight=0.7. F0.5 climbed monotonically with the
  # Tversky weight (0.9085 -> 0.9161 over {0.0, 0.3, 0.5, 0.7}, alpha/beta fixed
  # at 0.7/0.3), every weight beating pure BCE. CV stage-3b winner:
  # alpha_fp/beta_fn = 0.8/0.2, which led on both F0.5 (0.9258) and precision
  # (0.9230), with mIoU tied against 0.6/0.4. F0.5 was still rising at the
  # alpha=0.8 edge, so 0.9/0.1 is the next probe if this is pushed further.
  tversky_weight: 0.7
  tversky_alpha: 0.8
  tversky_beta: 0.2

  # CV winner: the "photometric" regime - colour jitter only, no flip or
  # rotation (confirmed across the stage-1 regime sweep and the stage-2
  # T x alpha grid). Spelled out because an empty augment_params would fall back
  # to the "full" regime instead.
  augment_params:
    flip_prob: 0.0
    max_rotation_deg: 0.0
    brightness: 0.2
    contrast: 0.2
    saturation: 0.2
    hue: 0.05

  qat_enabled: true
  track_redundancy: true
  redundancy_layers: [enc1a_dw, bottleneck_a_dw, dec2_conv_b_pw]

# Teacher - trained on the host only, never quantized, never deployed.
bu_net:
  filters: [64, 128, 256, 512, 1024]
  bottleneck: 1024
  decoder_filters: [512, 256, 128, 64]
  batch_size: 32
  weight_decay: 5.0e-3
