# Configuration for Nano-U Project

# Global Data settings
data:
  input_shape: [60, 80, 3]  # Height, Width, Channels (TF format: NHWC)
  num_classes: 1            # Binary segmentation
  
  # Normalization parameters (used in training and inference preprocessing)
  # Data is normalized to [-1, 1] range: (x / 255.0 - mean) / std
  normalization:
    mean: [0.5, 0.5, 0.5]
    std: [0.5, 0.5, 0.5]

  # Data splitting strategy used in preparation
  split:
    train: 0.7
    validation: 0.2
    test: 0.1

  paths:
    processed: 
      root: "data/TinyAgri"
      train:
        img: "data/TinyAgri/train/img"
        mask: "data/TinyAgri/train/mask"
      val:
        img: "data/TinyAgri/val/img"
        mask: "data/TinyAgri/val/mask"
      test:
        img: "data/TinyAgri/test/img"
        mask: "data/TinyAgri/test/mask"

    models_dir: "models/TinyAgri"
    results_dir: "results/TinyAgri"
    

# Model Architecture Definitions
models:
  # Teacher Model (BU_Net)
  bu_net:
    filters: [64, 128, 256, 512, 1024] # Encoder filters
    bottleneck: 1024
    decoder_filters: [512, 256, 128, 64]
    
  # Student Model (Nano_U)
  nano_u:
    filters: [4, 8, 16]
    bottleneck: 16
    decoder_filters: [16, 8, 4]


# Training Hyperparameters
training:
  # General settings
  seed: 98
  
  # Teacher (BU_Net) training config
  bu_net:
    epochs: 200
    batch_size: 32
    learning_rate: 1e-3
    weight_decay: 5e-3
    optimizer: "adamw"
    loss: "binary_crossentropy" 
    augment: true
    early_stopping: true
    patience: 20
    lr_scheduler: "plateau"
    lr_plateau_patience: 10
    lr_plateau_factor: 0.2
    min_lr: 1e-6

  # Student (Nano_U) training config
  nano_u:
    epochs: 200
    batch_size: 16
    learning_rate: 1e-3
    weight_decay: 1e-4
    optimizer: "adamw"
    loss: "binary_crossentropy"
    # Conservative (precision-favoring) supervised loss for the student only.
    # student_loss = (1-tversky_weight)*BCE + tversky_weight*Tversky.
    # alpha_fp > beta_fn penalizes false-path pixels (collisions) harder than
    # missed path (over-caution). Set tversky_weight: 0.0 for legacy pure BCE.
    # BU-Net ignores these (it trains via the plain Keras path).
    # CV Stage-3 winner: tversky_weight=0.7. f0.5 climbed monotonically with the
    # Tversky weight (0.9085 -> 0.9161 over {0.0,0.3,0.5,0.7}, alpha/beta fixed at
    # 0.7/0.3), every weight beating pure BCE - consistent with the precision-
    # favoring goal.
    # CV Stage-3b winner: alpha_fp/beta_fn = 0.8/0.2. A follow-up k=2 sweep over
    # alpha in {0.6,0.7,0.8} (beta=1-alpha, tversky_weight fixed at 0.7) put 0.8/0.2
    # on top for both f0.5 (0.9258) and precision (0.9230), mIoU tied with 0.6/0.4
    # (0.8611 vs 0.8620). Heavier false-positive weight => more precision => higher
    # f0.5, as expected for the precision-favoring goal. f0.5 was still rising at
    # the alpha=0.8 edge, so 0.9/0.1 is the next probe if pushed further.
    tversky_weight: 0.7
    tversky_alpha: 0.8   # false-positive (false path) weight
    tversky_beta: 0.2    # false-negative (missed path) weight
    augment: true
    # CV winner: the "photometric" regime - colour jitter only, no flip/rotation
    # (confirmed across Stage-1 regime sweep and Stage-2 T x alpha grid). With
    # augment_params absent the code falls back to make_dataset defaults
    # (flip 0.5 + rot 20 deg = the "full" regime), so set them explicitly here.
    augment_params:
      flip_prob: 0.0
      max_rotation_deg: 0.0
      brightness: 0.2
      contrast: 0.2
      saturation: 0.2
      hue: 0.05
    early_stopping: true
    patience: 20
    use_nas: true
    qat_enabled: true
    lr_scheduler: "plateau"
    lr_plateau_patience: 10
    lr_plateau_factor: 0.2
    min_lr: 1e-6
    layers_to_monitor: ['enc1a_dw', 'bottleneck_a_dw', 'dec2_conv_b_pw']
    
    # Knowledge Distillation settings
    distillation:
      enabled: true
      teacher_weights: "models/TinyAgri/bu_net.h5"
      # CV Stage-2 winner (photometric + CE on): best mIoU (0.8609) / F0.5 (0.9143)
      # over the T x alpha grid. alpha sat at the low edge of the grid (lower =>
      # more CE weight => more precision-favoring); T=0.7 was the mild mIoU pick.
      alpha: 0.3        # Weight for the distillation (teacher) term; (1-alpha) is the CE weight
      temperature: 0.7  # Teacher softening temperature


# Quantization settings (TFLite)
quantization:
  method: "dynamic_range" # or "full_integer"
  representative_dataset_size: 100
  input_type: "int8"
  output_type: "int8"
  supported_ops:
    - "TFLITE_BUILTINS_INT8"
    - "SELECT_TF_OPS"
