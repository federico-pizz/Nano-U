# Every default, in one place. A preset overrides only what it changes.
#
# The `training:` keys below are the fields of TrainConfig (src/nanou/config.py);
# the dataclass is the authority and these values must match it - a unit test
# asserts they do. `data:` and `quantization:` describe the dataset and the INT8
# export rather than a training run, so they keep their nested shape.

training:
  # Optimization
  epochs: 100
  batch_size: 16
  learning_rate: 1.0e-3
  weight_decay: 0.0
  optimizer: adam

  # Augmentation. An empty augment_params falls back to augment_pair's defaults
  # (the "full" regime: flip, rotation and colour jitter), so a preset that wants
  # a specific regime has to spell it out.
  augment: false
  augment_params: {}

  # Stopping and learning-rate schedule
  early_stopping: false
  patience: 10
  lr_scheduler: ""          # "" or "plateau"
  lr_plateau_patience: 5
  lr_plateau_factor: 0.2
  min_lr: 1.0e-6

  # Quantization-aware training. On by default: the student is a deployment
  # model and QAT has to be present from epoch 1, not bolted on afterwards.
  qat_enabled: true

  # Knowledge distillation. Off by default so a bare model block trains alone;
  # the QAD presets turn it on for the student.
  use_distillation: false
  teacher_model_name: bu_net
  teacher_weights: null
  alpha: 0.3                # weight on the teacher term; (1-alpha) is the CE weight
  temperature: 4.0

  # Rescaling of the distillation term after temperature scaling.
  #   squared - multiply by T^2, the classical Hinton correction, which assumes T>1
  #   none    - leave the term alone
  # The tuned TinyAgri temperature is 0.7, so T^2 = 0.49 down-weights KD rather
  # than compensating for anything. "none" is the other half of that experiment.
  t_scale: squared

  # Conservative supervised loss, student only:
  #   (1 - tversky_weight)*BCE + tversky_weight*Tversky(alpha_fp, beta_fn)
  # alpha_fp > beta_fn penalizes false path harder than missed path. Weight 0.0
  # is plain BCE and leaves alpha/beta inert.
  tversky_weight: 0.0
  tversky_alpha: 0.7
  tversky_beta: 0.3

  # SVD channel-redundancy monitoring. Observation only: it logs the condition
  # number of each monitored layer's activations and touches neither the
  # gradients nor checkpoint selection, so it cannot change what a run learns.
  track_redundancy: false
  redundancy_every_epochs: 10
  redundancy_layers: [enc1a_dw, enc1a_pw]

  tensorboard: false
  seed: null

  # Architecture. filters/bottleneck/decoder_filters are per model, so they have
  # no useful default here and are set in each preset's model block.
  input_shape: [60, 80, 3]  # height, width, channels (NHWC)
  filters: null
  bottleneck: null
  decoder_filters: null

  # Output locations. Set per preset, since both are per dataset.
  models_dir: null
  output_dir: null

data:
  # Normalization: (x / 255.0 - mean) / std  ->  [-1, 1]
  normalization:
    mean: [0.5, 0.5, 0.5]
    std: [0.5, 0.5, 0.5]

# The export is always full-integer INT8 with INT8 input and output; these keys
# only choose the calibration data.
quantization:
  # Split used to calibrate INT8 scales and zero-points. "val" reproduces the
  # published results, but val also selects the checkpoint, so calibration is
  # not independent of model selection; "train" is the conservative choice.
  calibration_split: val    # "val" or "train"
  # Where the calibration data comes from. "noise" replaces the images with
  # random noise, which is what an export with no usable calibration data does.
  # It exists for the calibration ablation; a deployed model uses "images".
  calibration_source: images  # "images" or "noise"
  # Debug escape hatch: calibrate on random noise when the split has no images.
  # Leave false - a noise-calibrated INT8 model runs but means nothing.
  allow_noise_calibration: false
