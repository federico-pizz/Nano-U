# Configuration for Nano-U Project

# Global Data settings
data:
  input_shape: [60, 80, 3]  # Height, Width, Channels (TF format: NHWC)
  num_classes: 1            # Binary segmentation

  # Normalization parameters (used in training and inference preprocessing)
  # Data is normalized to [-1, 1] range: (x / 255.0 - mean) / std
  normalization:
    mean: [0.5, 0.5, 0.5]
    std: [0.5, 0.5, 0.5]

  # Data splitting strategy used in preparation
  split:
    train: 0.7
    validation: 0.2
    test: 0.1

  paths:
    processed:
      root: "data/BotanicGarden"
      train:
        img: "data/BotanicGarden/train/img"
        mask: "data/BotanicGarden/train/mask"
      val:
        img: "data/BotanicGarden/val/img"
        mask: "data/BotanicGarden/val/mask"
      test:
        img: "data/BotanicGarden/test/img"
        mask: "data/BotanicGarden/test/mask"

    models_dir: "models/BotanicGarden"
    results_dir: "results/BotanicGarden"


# Model Architecture Definitions
models:
  # Teacher Model (BU_Net)
  bu_net:
    filters: [64, 128, 256, 512, 1024] # Encoder filters
    bottleneck: 1024
    decoder_filters: [512, 256, 128, 64]

  # Student Model (Nano_U)
  nano_u:
    filters: [4, 8, 16]
    bottleneck: 16
    decoder_filters: [16, 8, 4]


# Training Hyperparameters
training:
  # General settings
  seed: 98

  # Teacher (BU_Net) training config
  bu_net:
    epochs: 200
    batch_size: 32
    learning_rate: 1e-3
    weight_decay: 1e-3
    optimizer: "adamw"
    loss: "binary_crossentropy"
    augment: true
    early_stopping: true
    patience: 20
    lr_scheduler: "plateau"
    lr_plateau_patience: 10
    lr_plateau_factor: 0.2
    min_lr: 1e-6

  # Student (Nano_U) training config
  nano_u:
    epochs: 200
    batch_size: 16
    learning_rate: 1e-3
    weight_decay: 1e-4
    optimizer: "adamw"
    loss: "binary_crossentropy"
    augment: true
    early_stopping: true
    patience: 20
    use_nas: true
    qat_enabled: true
    lr_scheduler: "plateau"
    lr_plateau_patience: 10
    lr_plateau_factor: 0.2
    min_lr: 1e-6
    layers_to_monitor: ['enc1a_dw', 'bottleneck_a_dw', 'dec2_conv_b_pw']

    # Conservative (precision-favoring) supervised loss for the student only.
    # student_loss = (1-tversky_weight)*BCE + tversky_weight*Tversky.
    # alpha_fp > beta_fn penalizes false-path pixels harder than missed path.
    # CV Stage-3 winner: tversky_weight=0.0 (pure BCE). At the tuned T=4.0, every
    # Tversky weight underperformed BCE on both f0.5 and mIoU (tv 0.0/0.3/0.5/0.7 ->
    # f0.5 0.9013/0.8959/0.8843/0.8978, miou 0.8672/0.8658/0.8560/0.8574). Unlike
    # TinyAgri (where Tversky helped), BotanicGarden gets no benefit from the
    # precision-favoring blend, so it stays on plain BCE. alpha/beta are inert at
    # weight 0.0 and were not swept here.
    tversky_weight: 0.0
    tversky_alpha: 0.7   # false-positive (false path) weight; inert at weight 0.0
    tversky_beta: 0.3    # false-negative (missed path) weight; inert at weight 0.0

    # CV winner: the "full" regime - geometric flip/rotation + colour jitter
    # (confirmed across Stage-1 regime sweep and Stage-2 T x alpha grid). With
    # augment_params absent the code falls back to make_dataset defaults, so they
    # are set explicitly here to reproduce the selected config exactly.
    augment_params:
      flip_prob: 0.5
      max_rotation_deg: 20.0
      brightness: 0.2
      contrast: 0.2
      saturation: 0.2
      hue: 0.05

    # Knowledge Distillation settings
    distillation:
      enabled: true
      teacher_weights: "models/BotanicGarden/bu_net.h5"
      # CV Stage-2 winner (full + CE on): F0.5 leader (0.9041) and co-best mIoU
      # (0.8692) over the T x alpha grid. alpha=0.3 (lower => more CE weight =>
      # more precision-favoring); T=4.0 was the interior mIoU/F0.5 peak.
      alpha: 0.3        # Weight for the distillation (teacher) term; (1-alpha) is the CE weight
      temperature: 4.0  # Teacher softening temperature

# Quantization settings (TFLite)
quantization:
  method: "dynamic_range" # or "full_integer"
  representative_dataset_size: 100
  input_type: "int8"
  output_type: "int8"
  supported_ops:
    - "TFLITE_BUILTINS_INT8"
    - "SELECT_TF_OPS"
