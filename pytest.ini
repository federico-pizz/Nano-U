[pytest]
addopts = -ra --strict-markers
markers =
    gpu: marks tests that require a CUDA GPU (deselect with -m "not gpu")
    contract: behaviour preservation, checked against the shipped artifacts
filterwarnings =
    ignore::DeprecationWarning:tensorflow_model_optimization
    ignore::UserWarning:tensorflow.lite.python.interpreter
    ignore::UserWarning:tensorflow.lite.python.convert
    # Test presets live under tmp_path, which is always outside the repository.
    ignore:path .* resolves outside the project root:UserWarning
